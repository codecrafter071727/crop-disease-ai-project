<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌿 Crop Disease Analyzer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    h2 {
      color: green;
    }
    .result-box {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f9f9f9;
    }
    .solution {
      margin-top: 10px;
    }
    .solution strong {
      color: #333;
    }
  </style>
</head>
<body>
  <h2>🌿 Crop Disease Analyzer</h2>
  <form id="upload-form">
    <input type="file" id="file-input" accept="image/*">
    <button type="submit">Predict</button>
  </form>

  <div id="result" class="result-box" style="display:none;"></div>

  <script>
    document.getElementById("upload-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const fileInput = document.getElementById("file-input");
      if (fileInput.files.length === 0) {
        alert("Please select a file!");
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      try {
        const response = await fetch("http://127.0.0.1:8000/predict", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error("Prediction failed");
        }

        const result = await response.json();

        const resultDiv = document.getElementById("result");
        resultDiv.style.display = "block";
        resultDiv.innerHTML = `
          <p><strong>Prediction:</strong> ${result.predicted_disease}</p>
          <p><strong>Confidence:</strong> ${result.confidence.toFixed(2)}%</p>
          <div class="solution">
            <p><strong>✅ Solution (English):</strong> ${result.solution_en}</p>
            <p><strong>🇮🇳 समाधान (Hindi):</strong> ${result.solution_hi}</p>
          </div>
        `;
      } catch (error) {
        alert("Error: " + error.message);
      }
    });
  </script>
</body>
</html>
